# 判定ルールのひな形（構造が分かる最小限）。
#
# 実運用では、このファイルを config/rules.yaml にコピーして編集する。
# config/rules.yaml は .gitignore に入っており、コミットされない。
# ローダー（src/sfa/rules.py）は rules.yaml があればそれを、なければこのファイルを読む。
#
# ルールを変えたら、API を使わずに再集計できる:
#   python scripts/reclassify.py --genre "レシピ 料理"
#
# 文字列はすべて Python の正規表現。日本語はそのまま書ける。

# ---------------------------------------------------------------------------
# 冒頭の入り方（フォーマットの型）
#
# 冒頭 opening_window_sec 秒の発話テキストに対して、上から順に判定し、
# 最初に当たった型を採用する（1 本の動画に 1 つの型）。並び順 = 優先順位。
# どれにも当たらない動画は「未分類」になり、冒頭テキストが全件レポートに出る。
#
# match の書き方:
#   match: "やばい"                       1 つのパターン
#   match: ["やばい", "禁断"]              リスト = どれか 1 つ
#   match: {any: [...]}                   どれか 1 つ
#   match: {all: [...]}                   すべて
#   match: {not: ...}                     否定
#   any / all / not は入れ子にできる
# ---------------------------------------------------------------------------
opening_types:
  - id: hype_declaration
    name: 煽り宣言型
    one_line: 煽り語で入って宣言し、間を置かず素材投入へ
    match:
      all:
        - any: ["やばい", "禁断", "マジで"]
        - any: ["紹介します", "作ります"]

  - id: warning
    name: 警告・禁止型
    one_line: 否定・禁止で入ってスクロールを止める
    match:
      any: ["しないでください", "作ったらあかん", "食べないで"]

  # ジャンルに応じて追記する（例: 話題提示型 / 共感・独白型 / 問いかけ型）。
  # id は英数字で一意にする。silent と unclassified は予約語なので使わない。

# 発話のない動画の型。字幕がない動画と、字幕が音楽・効果音の表記だけの動画がここに入る。
silent_type:
  name: 無音・テロップ型
  one_line: 発話がなく、BGM とテロップで見せる
  # [Music] などの表記と記号を除いた文字数がこれ未満なら「発話なし」とみなす
  max_speech_chars: 10

# 完成の提示。レシピの結論は「完成」。ジャンルに応じて追記する。
completion_markers: ["完成", "できた", "できました", "いただきます", "うまい"]

# 装飾。冒頭をどんな言葉で飾っているか（構造の型とは独立、1 本に複数付く）。
# 型は「冒頭が何をしているか」、装飾は「どう飾っているか」。装飾を型にすると、
# 同じ構造が煽り語の有無で別の型に割れる。冒頭テキストに対して照合する。
# ジャンルに応じて追記する。この項目がなくても動く。
modifiers:
  hype: { name: 煽り, patterns: ["やば", "禁断"] }
  superlative: { name: 最上級, patterns: ["世界一", "一番"] }

# 大量投入。冒頭の型とは独立した特徴量（どの型とも組み合わさる）。
bulk_input:
  - "大量の"
  - "大量消費"
  - '\d+\s*(キロ|kg|k)'
  - "丸ごと"

# ブランド名。タイトルだけで照合する（自動生成字幕では崩れるため）。
# 完全一致の文字列で書く（正規表現ではない）。ジャンルに応じて追記する。
# 英字一般のような広いルールは入れない（#shorts、ASMR、vlog が誤爆する）。
brands: ["無印", "ダイソー"]

# 問いかけ・CTA の検出（位置とあり率をプロファイルに出す）
question_pattern: "[？?]|(?:ですか|ますか|でしょうか|知ってる|知ってます|なんで|どうして|なぜ)"
cta_verbs: ["フォロー", "いいね", "コメント", "保存", "シェア", "チャンネル登録", "概要欄", "プロフ"]

# タイトルの型（上から順に評価）
title:
  order: [数値型, 疑問型, 否定型, 命令型]
  patterns:
    数値型: '\d|[０-９]'
    疑問型: "[？?]"
    否定型: "(?:ないで|ダメ|禁止|NG)"
    命令型: "(?:して|しよう|見て|作って|レシピ|方法|やり方|コツ)"

thresholds:
  opening_window_sec: 3.0
  position_bands: { front: [0, 33], mid: [34, 66], back: [67, 100] }
  min_type_size: 5               # これ未満の型は範囲を出さず「参考値」と注記する
  presence_share: 0.5            # 問いかけ・CTA などを構成レシピに載せる最低あり率
  discovery_min_unclassified: 5  # 未分類がこの本数以上のとき、発見用のクラスタリングを回す
