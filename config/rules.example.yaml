# 判定ルールの汎用最小セット。
#
# 実運用では、このファイルを config/rules.yaml にコピーして編集する。
# config/rules.yaml は .gitignore に入っており、コミットされない。
# ローダー（src/sfa/rules.py）は rules.yaml があればそれを、なければこのファイルを読む。
#
# 正規表現は Python の re 構文。日本語はそのまま書ける。

opening:
  # 冒頭3秒の発話タイプ。上から順に評価し、最初にマッチしたものを採用する。
  # 順序 = 優先順位。ここを入れ替えると判定が変わる。
  order:
    - 問いかけ
    - 否定形
    - 数値提示
    - 結論先出し
    - 商品名
    - 呼びかけ
  patterns:
    問いかけ: "[？?]|(?:ですか|ますか|でしょうか|知ってる|知ってます|ありませんか|じゃない[？?]?|なんで|どうして|なぜ|どっち|どれ)"
    否定形: "(?:やめて|やめろ|ダメ|だめ|NG|禁止|絶対に?(?:しないで|使わないで|買わないで)|間違い|間違って|損して|してない|できてない|知らないと|やってはいけない|してはいけない|ない[。！!]?$)"
    数値提示: "(?:\\d|[０-９]|[一二三四五六七八九十百千万]{1,3}(?:つ|個|選|分|秒|円|倍|割|%|％|kg|g|日|回|位|種類|ステップ))"
    結論先出し: "(?:結論|つまり|要するに|実は|ポイントは|正解は|答えは|おすすめは|一番は|これが|これで完成|完成|まとめ|以上)"
    # 商品名 は下の brands と product_extra から自動生成される
    呼びかけ: "(?:みんな|皆さん|みなさん|あなた|君|お前|〜さん|の人|な人|ちゃん|ってる人|してる人|悩んでる|ですよね|よね[！!]?)"
  # どれにも当てはまらないときの最後の判定（成果を先に言い切るタイプ）
  fallback_conclusion: "(?:できる|できます|完成|になります|作れます|方法|やり方)"

# 商品名・ブランド名。ジャンルに応じて追記する。
# 例: 美容ジャンルなら コスメブランド、家電なら メーカー名 を足す。
# この例は日用品・コンビニ寄りの最小セット。
brands:
  - 無印
  - ダイソー
  - セリア
  - ユニクロ
  - コストコ
  - 業スー
  - カルディ
  - スタバ
  - マック
  - セブン
  - ローソン
  - ファミマ
# ブランド名以外で「商品を紹介している」ことを示す表現
product_extra: "(?:[A-Za-zＡ-Ｚａ-ｚ]{3,}|の(?:新作|新商品|商品)|買ってみた|使ってみた|レビュー|開封)"

# 結論・完成を示すマーカー（位置検出に使う）
conclusion_markers:
  - 結論
  - つまり
  - 要するに
  - 実は
  - ポイントは
  - 正解は
  - 答えは
  - おすすめは
  - 一番は
  - これが
  - これで完成
  - 完成
  - まとめ
  - 以上

# CTA（行動喚起）の動詞・名詞
cta_verbs:
  - フォロー
  - いいね
  - コメント
  - 保存
  - シェア
  - チャンネル登録
  - 登録して
  - 概要欄
  - プロフ
  - リンク
  - ハイライト
  - 試して
  - 作ってみて
  - やってみて
  - チェックして
  - 見てね
  - 次回
  - 続き

title:
  # タイトルの型。上から順に評価。
  order:
    - 数値型
    - 疑問型
    - 否定型
    - Before/After型
    - 命令型
    - 断定型
  patterns:
    数値型: "(?:\\d|[０-９]|[一二三四五六七八九十百千万]{1,3}(?:つ|個|選|分|秒|円|倍|割|%|％|kg|g|日|回|位|種類|ステップ))"
    疑問型: "[？?]|(?:ですか|ますか|でしょうか|知ってる|知ってます|ありませんか|じゃない[？?]?|なんで|どうして|なぜ|どっち|どれ)"
    否定型: "(?:やめて|やめろ|ダメ|だめ|NG|禁止|絶対に?(?:しないで|使わないで|買わないで)|間違い|間違って|損して|してない|できてない|知らないと|やってはいけない|してはいけない|ない[。！!]?$)"
    Before/After型: "(?i)(?:before|after|ビフォー|アフター|→|⇒|から.*に|が.*になる|変わる|激変|逆転)"
    命令型: "(?:しろ|して|しよう|やれ|やって|見て|作って|買って|使って|注意|必見|保存版|方法|やり方|コツ|裏技|レシピ)"
    断定型: "(?:最強|最高|神|一番|絶対|本当に|ガチ|マジ|正直|結論)"

thresholds:
  opening_window_sec: 3.0        # 「冒頭」とみなす秒数
  topic_shift_window_sec: 5.0    # 話題転換検出の窓幅
  topic_shift_jaccard: 0.12      # この値未満で「話題が変わった」とみなす
  presence_share: 0.5            # 問いかけ/CTA を「このフォーマットの特徴」とみなす出現率
  min_cluster_for_ranges: 5      # これ未満のクラスタは範囲を出さず参考値扱い
